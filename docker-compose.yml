services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    environment:
      # API persists to SQLite (see services/store.py); override with SANDBOXPROOF_DB if needed
      SANDBOXPROOF_DB: /data/sandboxproof.db
      USE_SIMULATOR: ${USE_SIMULATOR:-false}
    volumes: [apidata:/data]
volumes:
  apidata:
