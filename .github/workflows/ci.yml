name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install fastapi uvicorn pydantic httpx pytest python-dotenv
      - run: python -m pytest tests/unit tests/integration -q
        env: { USE_SIMULATOR: "true" }
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: "apps/web/package-lock.json" }
      - run: npm --prefix apps/web ci && npm --prefix apps/web run build
        env: { NEXT_PUBLIC_API: "http://localhost:8000" }
